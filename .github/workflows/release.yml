name: Release

on:
  push:
    tags:
      - "v*"

# Prevent this workflow from running on pull_request or other events
# even if the workflow file is modified in a PR.

jobs:
  build:
    runs-on: macos-26
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build release archive
        run: |
          xcodebuild -project VOEMonitor.xcodeproj -scheme VOEMonitor \
            -configuration Release -archivePath build/VOEMonitor.xcarchive \
            archive CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Package app
        run: |
          cp -R "build/VOEMonitor.xcarchive/Products/Applications/VOE Monitor.app" build/
          cd build && zip -r VOEMonitor.zip "VOE Monitor.app"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          RESULT=$(xcrun notarytool submit build/VOEMonitor.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1) || true
          echo "$RESULT"

          # Extract submission ID and fetch log on failure
          SUB_ID=$(echo "$RESULT" | grep "id:" | head -1 | awk '{print $2}')
          STATUS=$(echo "$RESULT" | grep "status:" | tail -1 | awk '{print $2}')

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1 || true
            exit 1
          fi

          # Staple the ticket to the app, then re-zip
          xcrun stapler staple "build/VOE Monitor.app"
          cd build && rm VOEMonitor.zip && zip -r VOEMonitor.zip "VOE Monitor.app"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          gh release create "$VERSION" build/VOEMonitor.zip \
            --title "VOE Monitor ${VERSION#v}" \
            --generate-notes

      - name: Update Homebrew tap
        if: vars.HOMEBREW_TAP_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(shasum -a 256 build/VOEMonitor.zip | awk '{print $1}')

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          cd tap

          cat > Casks/voe-monitor.rb << CASK
          cask "voe-monitor" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/yefimtsev/voe-monitor/releases/download/v#{version}/VOEMonitor.zip"
            name "VOE Monitor"
            desc "Power outage schedule for Vinnytsia region in your menubar"
            homepage "https://github.com/yefimtsev/voe-monitor"

            depends_on macos: ">= :tahoe"

            app "VOE Monitor.app"

            zap trash: [
              "~/Library/Application Support/VOEMonitor",
              "~/Library/Preferences/com.github.yefimtsev.VOEMonitor.plist",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/voe-monitor.rb
          git commit -m "Update voe-monitor to ${VERSION}"
          git push

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
