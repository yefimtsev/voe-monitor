name: TestFlight

# Tag convention:
#   v1.0.0      → macOS release (release-macos.yml)
#   mac-v1.0.0  → macOS release (release-macos.yml)
#   beta/1.0.0  → iOS TestFlight (this workflow)
#
# Signing: the team's Apple Distribution .p12 goes into a temporary keychain, and asc
# fetches (or creates) the App Store profiles. Automatic signing doesn't work
# on this runner: it has no GUI session, so codesign can't use keys in the login keychain.

on:
  push:
    tags:
      - 'beta/*'

# One upload at a time; never cancel one halfway.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: [self-hosted, macOS]
    env:
      # The runner must have exactly this asc version installed (brew install asc).
      ASC_VERSION: "5.17.1"
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_KEY_CONTENT }}
      ASC_BYPASS_KEYCHAIN: "1"
      ASC_NO_UPDATE: "1"
      APP_BUNDLE_ID: com.github.yefimtsev.VOEMonitor.iOS
      SIGNING_DIR: build/signing

    steps:
      - uses: actions/checkout@v5

      - name: Check tools
        run: |
          installed=$(asc --version | awk '{print $1}')
          if [ "$installed" != "$ASC_VERSION" ]; then
            echo "::error::asc $installed is installed, this workflow is pinned to $ASC_VERSION"
            exit 1
          fi
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::Set the ASC_APP_ID repository variable (asc apps list)"
            exit 1
          fi
          xcodebuild -version

      - name: Prepare signing keychain
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KEYCHAIN_PATH="$RUNNER_TEMP/voe-$RUN_KEY.keychain-db"
          P12_PATH="$RUNNER_TEMP/voe-$RUN_KEY.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24 | tr -d '\n')

          printf '%s' "$IOS_DIST_P12_B64" | tr -d ' \r\n' | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$P12_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::error::IOS_DIST_P12_B64 has no Apple Distribution identity"
            exit 1
          fi
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Resolve version and build number
        run: |
          VERSION="${GITHUB_REF_NAME#beta/}"
          # Not filtered by version: build numbers keep growing across versions, as they did with fastlane.
          BUILD=$(asc builds next-build-number --app "$ASC_APP_ID" --platform IOS --output json | jq -er '.nextBuildNumber')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "Deploying $GITHUB_REF_NAME as $VERSION ($BUILD)"

      # --match-extensions also covers the widget; --create-missing makes the profiles the first time.
      - name: Fetch and install provisioning profiles
        run: |
          mkdir -p "$SIGNING_DIR"
          asc signing fetch --app "$ASC_APP_ID" --bundle-id "$APP_BUNDLE_ID" \
            --certificate-type DISTRIBUTION --profile-type IOS_APP_STORE \
            --match-extensions --create-missing \
            --output "$SIGNING_DIR" --format json > "$SIGNING_DIR/fetch.json"
          .github/scripts/install-profiles.sh "$SIGNING_DIR" "$SIGNING_DIR/ExportOptions.plist"

      - name: Archive
        run: |
          xcodebuild archive \
            -project VOEMonitor.xcodeproj -scheme VOEMonitorIOS -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/VOEMonitorIOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=SUM249566D \
            VOE_APP_PROFILE="$VOE_APP_PROFILE" \
            VOE_WIDGET_PROFILE="$VOE_WIDGET_PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/VOEMonitorIOS.xcarchive \
            -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" \
            -exportPath build/ipa

      - name: Upload to TestFlight
        run: |
          IPAS=(build/ipa/*.ipa)
          if [ ${#IPAS[@]} -ne 1 ] || [ ! -f "${IPAS[0]}" ]; then
            echo "::error::Expected exactly one IPA in build/ipa, found: ${IPAS[*]}"
            exit 1
          fi
          asc publish testflight --app "$ASC_APP_ID" --ipa "${IPAS[0]}" --upload-only --output json

      - name: Clean up
        if: always()
        run: |
          # Rebuild the search list from what is there now: drop this run's keychain and any entry whose
          # file no longer exists (a dangling entry breaks Certificate Assistant and codesign lookups).
          keep=()
          while IFS= read -r k; do
            k=$(echo "$k" | tr -d ' "')
            [ -n "$k" ] && [ "$k" != "${KEYCHAIN_PATH:-}" ] && [ -e "$k" ] && keep+=("$k")
          done < <(security list-keychains -d user)
          [ ${#keep[@]} -gt 0 ] || keep=("$HOME/Library/Keychains/login.keychain-db")
          security list-keychains -d user -s "${keep[@]}"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || rm -f "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP"/voe-*.p12
          rm -rf build

# Required:
#   secrets.ASC_KEY_ID, secrets.ASC_ISSUER_ID   App Store Connect API key
#   secrets.ASC_KEY_CONTENT                     Base64 of the .p8 key file
#   secrets.IOS_DIST_P12_B64                    Base64 of the team's Apple Distribution .p12
#   secrets.IOS_DIST_P12_PASSWORD               Password of that .p12
#   vars.ASC_APP_ID                             App Store Connect app ID of the iOS app
