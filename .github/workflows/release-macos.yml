# Tag convention:
#   v1.0.0      → macOS release (this workflow)
#   mac-v1.0.0  → macOS release (this workflow), published as v1.0.0
#   beta/1.0.0  → iOS TestFlight (testflight.yml)

name: Release (macOS)

on:
  push:
    tags:
      - "v*"
      - "mac-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.3.0)'
        required: true
      dry_run:
        description: 'Dry run (build and package only: no notarization, release or Homebrew update)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # true only for a manual dry run; tag pushes have no inputs.
      DRY_RUN: ${{ inputs.dry_run == true }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#mac-}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.3.0"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install tools
        run: brew install create-dmg

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build release archive
        run: |
          xcodebuild -project VOEMonitor.xcodeproj -scheme VOEMonitor \
            -configuration Release -archivePath build/VOEMonitor.xcarchive \
            archive CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION"

      - name: Package DMG
        run: |
          mkdir -p build/dmg-staging
          cp -R "build/VOEMonitor.xcarchive/Products/Applications/VOE Monitor.app" build/dmg-staging/
          create-dmg \
            --volname "VOE Monitor" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "VOE Monitor.app" 140 200 \
            --hide-extension "VOE Monitor.app" \
            --app-drop-link 400 200 \
            --no-internet-enable \
            "build/VOEMonitor.dmg" \
            "build/dmg-staging/" || true
          # create-dmg exits 2 when it can't set a custom icon (CI limitation)
          test -f build/VOEMonitor.dmg

      # Same App Store Connect API key as TestFlight, so no Apple ID password in secrets.
      - name: Notarize
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          .github/scripts/write-asc-key.sh "$KEY"
          AUTH=(--key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")

          RESULT=$(xcrun notarytool submit build/VOEMonitor.dmg "${AUTH[@]}" --wait --output-format json) || true
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | jq -r '.status // empty')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: ${STATUS:-unknown}"
            SUB_ID=$(echo "$RESULT" | jq -r '.id // empty')
            [ -n "$SUB_ID" ] && xcrun notarytool log "$SUB_ID" "${AUTH[@]}" || true
            exit 1
          fi

          xcrun stapler staple build/VOEMonitor.dmg

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always published as vX.Y.Z; gh creates the tag at this commit if it doesn't exist yet.
          gh release create "v$VERSION" build/VOEMonitor.dmg \
            --target "$GITHUB_SHA" \
            --title "VOE Monitor $VERSION" \
            --generate-notes

      # This repository is its own Homebrew tap. The cask on master is the template: only version,
      # sha256 and the minimum macOS change per release, and the minimum comes from the built app.
      - name: Update the Homebrew cask
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CASK: Casks/voe-monitor.rb
        run: |
          SHA=$(shasum -a 256 build/VOEMonitor.dmg | awk '{print $1}')
          MIN=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "build/dmg-staging/VOE Monitor.app/Contents/Info.plist")
          case "${MIN%%.*}" in
            26) OS=tahoe ;;
            15) OS=sequoia ;;
            *) echo "::error::No Homebrew name for macOS $MIN; add it here"; exit 1 ;;
          esac

          # Edit master's copy, not the tag's: master can be ahead of the release tag.
          BLOB=$(gh api "repos/$GITHUB_REPOSITORY/contents/$CASK?ref=master" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/contents/$CASK?ref=master" --jq .content | base64 --decode > cask.rb
          sed -E -i '' \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$SHA\"/" \
            -e "s/^  depends_on macos: .*$/  depends_on macos: :$OS/" cask.rb
          for expected in "version \"$VERSION\"" "sha256 \"$SHA\"" "depends_on macos: :$OS"; do
            grep -qF "  $expected" cask.rb || { echo "::error::$CASK has no line for: $expected"; exit 1; }
          done

          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$CASK" \
            -f message="chore(cask): Update voe-monitor to $VERSION" \
            -f content="$(base64 -i cask.rb)" -f sha="$BLOB" -f branch=master > /dev/null
          echo "Cask updated to $VERSION (macOS $OS+)"

      - name: Clean up
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/certificate.p12

# Required:
#   secrets.CERTIFICATE_P12, secrets.CERTIFICATE_PASSWORD  Developer ID Application certificate
#   secrets.APPLE_TEAM_ID
#   secrets.ASC_KEY_ID, secrets.ASC_ISSUER_ID, secrets.ASC_KEY_CONTENT  App Store Connect API key (notarization)
# The Homebrew cask (Casks/voe-monitor.rb) is updated with GITHUB_TOKEN; no tap token is needed.
