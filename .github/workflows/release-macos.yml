# Tag convention:
#   v1.0.0      → triggers macOS release (this workflow)
#   mac-v1.0.0  → triggers macOS release (this workflow)
#   beta/1.0.0  → triggers iOS TestFlight (testflight.yml)

name: Release (macOS)

on:
  push:
    tags:
      - "v*"
      - "mac-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.3.0)'
        required: true
      dry_run:
        description: 'Dry run (skip notarize + release)'
        type: boolean
        default: false

# Prevent this workflow from running on pull_request or other events
# even if the workflow file is modified in a PR.

jobs:
  build:
    runs-on: macos-26
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install create-dmg

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build release archive
        run: |
          VERSION=${{ github.event.inputs.version || '${GITHUB_REF_NAME#v}' }}
          VERSION=${VERSION#v}
          VERSION=${VERSION#mac-v}
          xcodebuild -project VOEMonitor.xcodeproj -scheme VOEMonitor \
            -configuration Release -archivePath build/VOEMonitor.xcarchive \
            archive CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION"

      - name: Package DMG
        run: |
          cp -R "build/VOEMonitor.xcarchive/Products/Applications/VOE Monitor.app" build/

          # Create styled DMG with icon positioning and drag-to-Applications
          mkdir -p build/dmg-staging
          cp -R "build/VOE Monitor.app" build/dmg-staging/
          create-dmg \
            --volname "VOE Monitor" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "VOE Monitor.app" 140 200 \
            --hide-extension "VOE Monitor.app" \
            --app-drop-link 400 200 \
            --no-internet-enable \
            "build/VOEMonitor.dmg" \
            "build/dmg-staging/" || true
          # create-dmg exits 2 when it can't set a custom icon (CI limitation)
          test -f build/VOEMonitor.dmg

      - name: Notarize app
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          RESULT=$(xcrun notarytool submit build/VOEMonitor.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1) || true
          echo "$RESULT"

          # Extract submission ID and fetch log on failure
          SUB_ID=$(echo "$RESULT" | grep "id:" | head -1 | awk '{print $2}')
          STATUS=$(echo "$RESULT" | grep "status:" | tail -1 | awk '{print $2}')

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1 || true
            exit 1
          fi

          # Staple the notarization ticket to the DMG
          xcrun stapler staple build/VOEMonitor.dmg

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          gh release create "$VERSION" build/VOEMonitor.dmg \
            --title "VOE Monitor ${VERSION#v}" \
            --generate-notes

      - name: Update Homebrew tap
        if: vars.HOMEBREW_TAP_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(shasum -a 256 build/VOEMonitor.dmg | awk '{print $1}')

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          cd tap

          cat > Casks/voe-monitor.rb << CASK
          cask "voe-monitor" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/yefimtsev/voe-monitor/releases/download/v#{version}/VOEMonitor.dmg"
            name "VOE Monitor"
            desc "Power outage schedule for Vinnytsia region in your menubar"
            homepage "https://github.com/yefimtsev/voe-monitor"

            depends_on macos: ">= :sequoia"

            app "VOE Monitor.app"

            zap trash: [
              "~/Library/Application Support/VOEMonitor",
              "~/Library/Preferences/com.github.yefimtsev.VOEMonitor.plist",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/voe-monitor.rb
          git commit -m "Update voe-monitor to ${VERSION}"
          git push

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
