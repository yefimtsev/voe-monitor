# Tag convention:
#   v1.0.0      → macOS release (this workflow)
#   mac-v1.0.0  → macOS release (this workflow), published as v1.0.0
#   beta/1.0.0  → iOS TestFlight (testflight.yml)

name: Release (macOS)

on:
  push:
    tags:
      - "v*"
      - "mac-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.3.0)'
        required: true
      dry_run:
        description: 'Dry run (build and package only: no notarization, release or Homebrew update)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # true only for a manual dry run; tag pushes have no inputs.
      DRY_RUN: ${{ inputs.dry_run == true }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#mac-}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.3.0"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install tools
        run: brew install create-dmg

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build release archive
        run: |
          xcodebuild -project VOEMonitor.xcodeproj -scheme VOEMonitor \
            -configuration Release -archivePath build/VOEMonitor.xcarchive \
            archive CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION"

      - name: Package DMG
        run: |
          mkdir -p build/dmg-staging
          cp -R "build/VOEMonitor.xcarchive/Products/Applications/VOE Monitor.app" build/dmg-staging/
          create-dmg \
            --volname "VOE Monitor" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "VOE Monitor.app" 140 200 \
            --hide-extension "VOE Monitor.app" \
            --app-drop-link 400 200 \
            --no-internet-enable \
            "build/VOEMonitor.dmg" \
            "build/dmg-staging/" || true
          # create-dmg exits 2 when it can't set a custom icon (CI limitation)
          test -f build/VOEMonitor.dmg

      # Same App Store Connect API key as TestFlight, so no Apple ID password in secrets.
      - name: Notarize
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")

          RESULT=$(xcrun notarytool submit build/VOEMonitor.dmg "${AUTH[@]}" --wait --output-format json) || true
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | jq -r '.status // empty')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: ${STATUS:-unknown}"
            SUB_ID=$(echo "$RESULT" | jq -r '.id // empty')
            [ -n "$SUB_ID" ] && xcrun notarytool log "$SUB_ID" "${AUTH[@]}" || true
            exit 1
          fi

          xcrun stapler staple build/VOEMonitor.dmg

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always published as vX.Y.Z; gh creates the tag at this commit if it doesn't exist yet.
          gh release create "v$VERSION" build/VOEMonitor.dmg \
            --target "$GITHUB_SHA" \
            --title "VOE Monitor $VERSION" \
            --generate-notes

      - name: Update Homebrew tap
        if: env.DRY_RUN != 'true' && vars.HOMEBREW_TAP_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA=$(shasum -a 256 build/VOEMonitor.dmg | awk '{print $1}')

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          cd tap

          cat > Casks/voe-monitor.rb << CASK
          cask "voe-monitor" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/yefimtsev/voe-monitor/releases/download/v#{version}/VOEMonitor.dmg"
            name "VOE Monitor"
            desc "Power outage schedule for Vinnytsia region in your menubar"
            homepage "https://github.com/yefimtsev/voe-monitor"

            depends_on macos: ">= :tahoe"

            app "VOE Monitor.app"

            zap trash: [
              "~/Library/Application Support/VOEMonitor",
              "~/Library/Caches/VOEMonitor",
              "~/Library/Preferences/com.github.yefimtsev.VOEMonitor.plist",
            ]
          end
          CASK

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/voe-monitor.rb
          git commit -m "Update voe-monitor to ${VERSION}"
          git push

      - name: Clean up
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/certificate.p12

# Required:
#   secrets.CERTIFICATE_P12, secrets.CERTIFICATE_PASSWORD  Developer ID Application certificate
#   secrets.APPLE_TEAM_ID
#   secrets.ASC_KEY_ID, secrets.ASC_ISSUER_ID, secrets.ASC_KEY_CONTENT  App Store Connect API key (notarization)
#   secrets.HOMEBREW_TAP_TOKEN, vars.HOMEBREW_TAP_REPO  optional, for the Homebrew cask
# No longer used: secrets.APPLE_ID, secrets.APPLE_PASSWORD
